<div class="space-y-12">
  <div class="max-w-3xl mx-auto text-center">
    <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Services</h1>
    <p class="mt-4 text-lg text-slate-400">
      Providing a range of offensive security services to identify, assess, and mitigate cyber risks.
    </p>
  </div>

  <!-- FIX: Uses @for (was already correct), added icon display, improved card design -->
  <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
    @for (service of services(); track service.name) {
      <div class="bg-slate-800/50 p-6 rounded-xl border border-slate-700 hover:border-cyan-500/50 transition-all duration-300 group flex flex-col gap-4">
        <div class="flex items-start gap-4">
          <span class="text-3xl" aria-hidden="true">{{ service.icon }}</span>
          <h2 class="text-xl font-bold text-cyan-400 group-hover:text-cyan-300 transition-colors">{{ service.name }}</h2>
        </div>
        <p class="text-slate-300 text-sm leading-relaxed flex-1">{{ service.description }}</p>
        <a
          [routerLink]="['/contact']"
          class="inline-flex items-center text-sm font-semibold text-cyan-400 hover:text-cyan-300 transition-colors mt-auto focus:outline-none focus:underline"
        >
          Book Consultation →
        </a>
      </div>
    }
  </div>
</div>
